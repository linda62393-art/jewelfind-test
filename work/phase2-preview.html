<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>蘊選｜Phase 2 預覽</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@500;600&display=swap');
    :root{--ivory:#fbf7f0;--gold:#b99457;--deep:#87662f;--soft:#f1e5cf;--rose:#d88d82;--ink:#302a25}*{box-sizing:border-box}body{margin:0;background:var(--ivory);font-family:'Noto Sans TC',sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}.app{min-height:100dvh;max-width:430px;margin:auto;padding:28px 24px;background:var(--ivory);overflow:hidden}.home{display:flex;flex-direction:column;min-height:100dvh}.brand{font-family:'Noto Serif TC';font-size:22px;letter-spacing:.16em;color:var(--deep)}.pill{font-size:10px;letter-spacing:.15em;border:1px solid #d6b980;border-radius:99px;padding:5px 10px;color:var(--deep)}.row{display:flex;justify-content:space-between;align-items:center}.hero{flex:1;display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--rose);font-size:13px;letter-spacing:.18em}.title{font:500 34px/1.4 'Noto Serif TC';margin:12px 0}.copy{color:#625a53;line-height:1.9;font-size:15px}.visual{height:240px;margin:30px 0;background:linear-gradient(135deg,#e9dac0,#fbf8f1,#dca69b);border-radius:30px;position:relative;box-shadow:0 14px 36px #5b41211a;overflow:hidden}.ring{position:absolute;left:36%;top:19%;width:30%;height:62%;border:10px solid #b99457cc;border-radius:48%;transform:rotate(32deg)}.stone{position:absolute;top:42%;left:46%;width:42px;height:42px;background:#fffffff0;transform:rotate(45deg);border-radius:8px;box-shadow:0 0 22px white}.primary{border:0;border-radius:16px;min-height:56px;width:100%;background:var(--deep);color:white;font-weight:600;box-shadow:0 10px 24px #5b412126}.subtle{text-align:center;color:#8b8178;font-size:12px;line-height:1.7;margin-top:13px}.back{border:0;background:none;color:#625a53;padding:9px 0}.progress-label{display:flex;justify-content:space-between;color:#8b8178;font-size:12px;margin:20px 0 8px}.progress{height:4px;background:var(--soft);border-radius:5px}.progress span{display:block;height:100%;border-radius:5px;background:var(--gold);transition:.3s}.question{padding-top:40px;min-height:calc(100dvh - 190px);display:flex;flex-direction:column}.question h1{font:500 29px/1.45 'Noto Serif TC';margin:10px 0}.hint{color:#8b8178;font-size:13px;line-height:1.6}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.choice{min-height:76px;text-align:left;border:1px solid #f1e5cf;background:#ffffffaa;border-radius:16px;padding:15px;color:var(--ink)}.choice.selected{background:var(--soft);border-color:var(--gold);color:var(--deep)}.materials{margin-top:24px;border-top:1px solid var(--soft);padding-top:20px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{border:1px solid #f1e5cf;background:#fff;border-radius:99px;min-height:39px;padding:0 13px;color:#625a53;font-size:13px}.chip.selected{background:var(--soft);border-color:var(--gold);color:var(--deep)}.footer{margin-top:auto}.upload{border:1px dashed #d6b980;background:#ffffff99;width:100%;height:205px;border-radius:24px;color:var(--deep);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px}.upload b{font-size:28px}.skip{border:0;background:none;width:100%;color:#625a53;font-size:13px;margin-top:11px;min-height:30px}.complete{text-align:center;display:flex;min-height:100dvh;flex-direction:column;justify-content:center}.complete h1{font:500 30px/1.5 'Noto Serif TC'}
  </style>
</head>
<body><main class="app" id="app"></main>
<script>
const data={purpose:['生日','求婚／結婚','周年','買給自己','姊妹／好友','其他'],product:['戒指','耳環','項鍊','手鍊','男戒','對戒','其他'],budget:['NT$ 10,000 以下','NT$ 10,000 – 30,000','NT$ 30,000 – 60,000','NT$ 60,000 – 100,000','NT$ 100,000 – 200,000','NT$ 200,000 – 500,000','NT$ 500,000 以上'],style:['甜美','精緻','霸氣','中性','設計感','簡約','華麗','不確定'],materials:['18K 黃金','18K 玫瑰金','18K 白金','鉑金','純銀','珍珠','鑽石','彩色寶石']};
const meta=[['從心意開始','這份珠寶，想為誰而選？','purpose'],['選一個方向','你想找哪一類珠寶？','product'],['保留剛好的空間','這次的預算範圍是？','budget'],['你的審美線索','哪個風格最接近你？','style'],['最後一點靈感','有喜歡的款式想讓我們看看嗎？','image']];
let screen='home',step=0,answers={materials:[]};const app=document.querySelector('#app');
const btn=(label,fn,cls='primary')=>`<button class="${cls}" onclick="${fn}">${label}</button>`;
function render(){if(screen==='home'){app.innerHTML=`<section class="home"><header class="row"><b class="brand">蘊選</b><span class="pill">JEWELRY MATCH</span></header><div class="hero"><p class="eyebrow">YOUR PRIVATE JEWELRY EDIT</p><h1 class="title">找到那件，剛好像你的珠寶。</h1><p class="copy">告訴我們一些心意與偏好，讓私人珠寶顧問為你精選值得相遇的作品。</p><div class="visual"><i class="ring"></i><i class="stone"></i></div></div>${btn('幫我找珠寶','start()')}<p class="subtle">專屬於你的風格與預算，不必一次決定。</p></section>`;return}if(screen==='complete'){app.innerHTML=`<section class="complete"><p class="eyebrow">MATCHING COMPLETE</p><h1>你的偏好已記下來了</h1><p class="copy">推薦商品將於下一階段接上。</p>${btn('重新填寫','restart()')}</section>`;return}const [eyebrow,title,key]=meta[step],options=data[key]||[];const selected=answers[key];let content=`<header><div class="row"><button class="back" onclick="back()">← 返回</button><b class="brand" style="font-size:17px">蘊選</b></div><div class="progress-label"><span>你的珠寶偏好</span><span>${step+1} / 5</span></div><div class="progress"><span style="width:${(step+1)*20}%"></span></div></header><section class="question"><p class="eyebrow">${eyebrow}</p><h1>${title}</h1>`;if(key==='product')content+=`<p class="hint">材質可複選，也可以先不選。</p>`;if(key==='image')content+=`<p class="hint">可上傳一張參考圖，這題可以略過。</p>`;if(key==='image')content+=`<button class="upload" onclick="previewImage()"><b>＋</b><span>上傳喜歡的珠寶照片</span><small style="color:#8b8178">JPG、PNG 皆可</small></button>`;else{content+=`<div class="choices">${options.map(x=>`<button class="choice ${selected===x?'selected':''}" onclick="choose('${key}','${x}')">${x}</button>`).join('')}</div>`;if(key==='product')content+=`<div class="materials"><span class="hint">偏好的材質（可複選）</span><div class="chips">${data.materials.map(x=>`<button class="chip ${answers.materials.includes(x)?'selected':''}" onclick="toggle('${x}')">${x}</button>`).join('')}</div></div>`}content+=`</section><footer class="footer">${btn(step===4?'為我精選珠寶':'繼續','next()',step<4&&!selected?'primary disabled':'primary')}${step===4?btn('略過此題','next()','skip'):''}</footer>`;app.innerHTML=content;document.querySelector('.disabled')?.setAttribute('disabled','');}
function start(){screen='match';render()}function choose(k,v){answers[k]=v;render()}function toggle(v){answers.materials=answers.materials.includes(v)?answers.materials.filter(x=>x!==v):[...answers.materials,v];render()}function next(){if(step<4&&!answers[meta[step][2]])return;if(step===4){screen='complete'}else step++;render()}function back(){if(step===0){screen='home'}else step--;render()}function restart(){step=0;answers={materials:[]};screen='match';render()}function previewImage(){alert('此預覽頁不會讀取你的檔案；正式 App 的照片選擇器已在 Phase 2 實作。')}render();
</script><script>
  new MutationObserver(() => {
    document.querySelectorAll('button').forEach((button) => {
      if (button.textContent === '略過此題') button.textContent = '直接找尋'
    })
  }).observe(document.querySelector('#app'), { childList: true, subtree: true })
</script></body></html>
